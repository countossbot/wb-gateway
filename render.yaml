# Universal AI Gateway —— Render 部署描述文件
#
# 用法：Render Dashboard → New → Blueprint → 关联本仓库，Render 会读取本文件。
#
# 数据库：v4.2.0 起支持外部 PostgreSQL 与 MySQL，按 DATABASE_URL 协议自动识别。
# 下面 DATABASE_URL 声明为 sync: false —— 首次部署时 Render 会提示手工填入连接串，
# 之后可在 Dashboard → Environment 随时修改，不会进 Git。
#   推荐 Aiven PostgreSQL: postgresql://user:pw@host:5432/db?sslmode=require
#   亦可远程 MySQL:        mysql://user:pw@host:3306/db
#
# 首启行为：应用启动时 src/instrumentation.ts 会调用 ensureDatabaseSchema()，
# 探测到空库后自动执行对应方言的 init SQL（PG: prisma/init.postgres.sql /
# MySQL: prisma/init.mysql.sql）建表，并播种默认管理员。
# 幂等，重复部署不会重复执行，无需手工迁移。
# 幂等，重复部署不会重复执行，无需手工迁移。

services:
  - type: web
    name: universal-ai-gateway
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter          # 免费层 15 分钟无流量会休眠，冷启动需等待建表完成
    region: oregon         # 与 Aiven 实例同区域：Aiven「California」= AWS us-west-2，选 Oregon 得 ~5-15ms RTT
    # 必须用 /healthz/live（纯存活探针，恒 200）。不要用 /healthz：它在未配置任何 provider
    # 时返回 503（degraded），而 Render 只把 2xx 判为健康，会导致部署永远卡在 deploying。
    # 业务就绪状态请访问 /healthz 查看。
    healthCheckPath: /healthz/live
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false        # Aiven Service URI，含 ?sslmode=require，手工填入
      - key: NODE_ENV
        value: production
      # Render 自动注入 PORT，应用按此监听，无需声明。
      # Aiven 不限制连接数，如遇冷启动并发飙升可追加连接池参数：
      #   DATABASE_URL=postgres://...?sslmode=require&connection_limit=10&pool_timeout=20
