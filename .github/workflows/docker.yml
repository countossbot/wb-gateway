name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: ghcr.io/countossbot/wb-gateway:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          provenance: true
          sbom: true

  merge:
    name: Merge manifests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-platform manifests
        env:
          IMAGE: ghcr.io/countossbot/wb-gateway
          SHA: ${{ github.sha }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:sha-${SHA:0:7}" \
            "$IMAGE:build-${SHA}-amd64" \
            "$IMAGE:build-${SHA}-arm64"

          if [ "$REF_TYPE" = "branch" ] && [ "$REF_NAME" = "main" ]; then
            docker buildx imagetools create \
              -t "$IMAGE:latest" \
              "$IMAGE:build-${SHA}-amd64" \
              "$IMAGE:build-${SHA}-arm64"
          fi

          if [ "$REF_TYPE" = "tag" ]; then
            docker buildx imagetools create \
              -t "$IMAGE:${REF_NAME}" \
              "$IMAGE:build-${SHA}-amd64" \
              "$IMAGE:build-${SHA}-arm64"
          fi
